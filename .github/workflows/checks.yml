name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python tools/check.py
      - run: python tools/check_firmware.py
      - run: python firmware/turret_manual_control/turret_manual_control/tests/check.py
